name: Split App.tsx

on:
  push:
    branches:
      - refactor/split-app-tsx

permissions:
  contents: write

jobs:
  split:
    if: "!contains(github.event.head_commit.message, 'chore: split App.tsx')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Extract App view
        run: node scripts/split-app-view.cjs

      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/app/AppControllerCore.tsx src/app/AppView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "chore: split App.tsx"
          git push
