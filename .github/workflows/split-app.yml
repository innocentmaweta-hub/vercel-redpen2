name: Split App.tsx

on:
  push:
    branches:
      - refactor/split-app-tsx

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Split App render tree
        run: node scripts/split-app-view.cjs

      - name: Commit generated split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/app/AppControllerCore.tsx src/app/AppView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: split App.tsx into controller and view"
          git push
