name: Apply RedPen requested updates

on:
  push:
    paths:
      - '.github/workflows/redpen-requested-updates.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          (root/'src/lib').mkdir(parents=True,exist_ok=True)
          (root/'src/lib/avatar.ts').write_text('''export function getDefaultAvatarUrl(email: string): string {\n  const s=(email||"user").trim().toLowerCase(); let h=0; for(const c of s) h=((h<<5)-h+c.charCodeAt(0))|0; const hue=Math.abs(h)%360; const local=s.split("@")[0]||"user"; const p=local.replace(/[^a-z0-9]+/gi," ").trim().split(/\\s+/).filter(Boolean); const initials=(p.length>1?p[0][0]+p[1][0]:local.slice(0,2)).toUpperCase(); const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" rx="80" fill="hsl(${hue} 65% 40%)"/><text x="200" y="225" text-anchor="middle" font-family="Arial" font-size="150" font-weight="700" fill="white">${initials}</text></svg>`; return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;\n}\n''',encoding='utf8')

          p=root/'src/App.tsx'; s=p.read_text()
          s=s.replace("import { writeFileToFolder } from './lib/fileStorage';", "import { writeFileToFolder } from './lib/fileStorage';\nimport * as XLSX from 'xlsx';\nimport { getDefaultAvatarUrl } from './lib/avatar';")
          s=s.replace("useState<'self' | 'ai' | 'unmarked'>('unmarked')", "useState<'self' | 'ai'>('self')")
          s=s.replace("setMarkingModeState('unmarked')", "setMarkingModeState('self')").replace("setMarkingModeState('unmarked');", "setMarkingModeState('self');")
          s=s.replace("markingMode !== 'unmarked'", "true").replace("markingMode === 'unmarked'", "false")
          s=s.replace("setUser(data.user);", "setUser({ ...data.user, avatarUrl: data.user.avatarUrl || getDefaultAvatarUrl(data.user.email) });")
          s=s.replace("avatarUrl: data.user.avatarUrl || '',", "avatarUrl: data.user.avatarUrl || getDefaultAvatarUrl(data.user.email),")

          loader='''    const handleLoadFromFile = () => {\n        const input=document.createElement("input"); input.type="file"; input.accept=".xlsx,.xls";\n        input.onchange=async(e)=>{ const file=(e.target as HTMLInputElement).files?.[0]; if(!file)return; try {\n          const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); const imported:HistoryRecord[]=[];\n          for(const sheetName of wb.SheetNames){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:""}) as any[][]; if(rows.length<2)continue; const heads=rows[0].map((x:any)=>String(x||"")); const idx=(n:string)=>heads.indexOf(n); const val=(r:any[],n:string)=>String(r[idx(n)]??"");\n            for(const r of rows.slice(1)){ if(!r.some((x:any)=>String(x??"").trim()))continue; const qs:any[]=[]; for(let q=1;q<=200;q++){const si=idx(`Q${q} Score`),fi=idx(`Q${q} Feedback`); if(si<0&&fi<0)break; const score=String(r[si]??""),feedback=String(r[fi]??""); if(score||feedback)qs.push({q,score,feedback});}\n              const studentInfo:StudentInfo={name:val(r,"Student Name"),regNo:val(r,"Reg No"),courseCode:val(r,"Course Code")||sheetName,program:val(r,"Program"),year:val(r,"Year"),semester:val(r,"Semester"),examDate:val(r,"Exam Date")};\n              imported.push({id:`excel_${Date.now()}_${imported.length}`,date:val(r,"Date Graded")||new Date().toISOString(),studentInfo,result:{totalScore:val(r,"Total Score"),score:val(r,"Total Score"),grade:val(r,"Grade"),percentage:val(r,"Percentage"),feedback:val(r,"Summary Feedback"),questions:qs}}); } }\n          }\n          if(!imported.length){alert("No grading results were found in that Excel file. Please choose a RedPen session workbook.");return;} const updated=[...imported,...history].slice(0,50); setHistory(updated); saveHistory(updated); const latest=imported[imported.length-1]; setStudentInfo(latest.studentInfo); setResult(latest.result); setStudentPaper(null); setMarkingScheme(null); setMarkingModeState("self"); setClearCount(c=>c+1); setActiveView("grade"); setShowOldSessionModal(false);\n          const base=file.name.replace(/\\.(xlsx|xls)$/i,""); const session:SemesterCourse={courseCode:latest.studentInfo.courseCode||"Imported",courseName:base,program:latest.studentInfo.program,year:latest.studentInfo.year,semester:latest.studentInfo.semester,sessionLabel:base,customName:base}; setSemesterCourse(session); saveSessions([session,...loadSessions().filter(x=>x.customName!==base)].slice(0,50)); alert(`Loaded ${imported.length} grading result${imported.length===1?"":"s"} from Excel.`);\n        }catch(err){console.error(err);alert("Error: Invalid Excel session file. Please select a RedPen .xlsx file.");} }; input.click(); };\n'''
          s,n=re.subn(r"    // Function to handle loading from JSON file.*?\n    // Function to add a new school",loader+"\n    // Function to add a new school",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('JSON loader not found')
          s=s.replace('Load from JSON File','Load from Excel File').replace('Select a saved grading session file (.json)','Select a RedPen session workbook (.xlsx)')
          needle='''                                    <div className="flex-1 p-4 flex flex-col transition-all overflow-hidden">\n                                        {studentPaper ? ('''
          repl='''                                    <div className="flex-1 p-4 flex flex-col transition-all overflow-hidden relative">\n                                        {studentPaper && <button onClick={handleNewPaper} className="absolute top-6 right-6 z-20 bg-gray-900/90 border border-gray-700 hover:border-red-500/60 text-gray-300 hover:text-red-400 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider">Clear Canvas</button>}\n                                        {studentPaper ? ('''
          if needle not in s: raise SystemExit('canvas area not found')
          s=s.replace(needle,repl,1)
          s=s.replace("'Unmarked'","'Self Marked'")
          p.write_text(s)

          p=root/'src/components/SettingsModal.tsx'; t=p.read_text()
          t=t.replace("type Tab = 'api-keys' | 'tokens' | 'save-location';","type Tab = 'tokens' | 'save-location';").replace("useState<Tab>('api-keys')","useState<Tab>('tokens')")
          t=re.sub(r"\n    const \[openaiKey, setOpenaiKey\].*?\n    const \[saving, setSaving\] = useState\(false\);","",t,count=1,flags=re.S)
          t=re.sub(r"\n    const handleSaveKeys = async \(\) => \{.*?\n    \};","",t,count=1,flags=re.S)
          t=re.sub(r"\s*\{\/\* Tab Switcher \*\/\}.*?\s*\{tab === 'api-keys' \? \(.*?\s*\) : tab === 'tokens' \? \(","""                    {/* Tab Switcher */}\n                    <div className=\"flex bg-gray-900 rounded-xl p-1\">\n                        <button onClick={() => setTab('tokens')} className={`flex-1 py-2 text-[11px] font-bold rounded-lg ${tab === 'tokens' ? 'bg-accent-blue text-white' : 'text-gray-500'}`}>Tokens</button>\n                        <button onClick={() => setTab('save-location')} className={`flex-1 py-2 text-[11px] font-bold rounded-lg ${tab === 'save-location' ? 'bg-accent-blue text-white' : 'text-gray-500'}`}>Save To</button>\n                    </div>\n                    {tab === 'tokens' ? (""",t,count=1,flags=re.S)
          p.write_text(t)

          p=root/'api/server-wordpress.js'; t=p.read_text()
          t=t.replace("      getUserMeta(wpUser.id, 'redpen_api_keys'),\n","").replace("    const safeApiKeys = apiKeys || {};\n","").replace("activeProvider: safeApiKeys.geminiApiKey ? 'gemini' : safeApiKeys.openaiApiKey ? 'openai' : 'server'","activeProvider: 'server'")
          t=re.sub(r"\napp.get\('/api/settings/api-keys'.*?\napp.post\('/api/settings/profile'","\napp.post('/api/settings/profile'",t,count=1,flags=re.S)
          p.write_text(t)

          p=root/'src/components/ProfileModal.tsx'; t=p.read_text(); t=re.sub(r"\nconst PROVIDER_LABEL: Record<string, string> = \{.*?\n\};\n","\n",t,count=1,flags=re.S); p.write_text(t)

      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src api
          git commit -m "feat: apply requested RedPen updates" || true
          git push
